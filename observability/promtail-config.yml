server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: taskflow
    static_configs:
      - targets: [localhost]
        labels:
          job: taskflow
          __path__: /var/log/taskflow/*.log
    pipeline_stages:
      - json:
          expressions:
            event: event
            request_id: request_id
            remote_addr: remote_addr
      - labels:
          event:
